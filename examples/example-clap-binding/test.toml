[[runs]]
input = [ "greet" ]

expect.exit-code = 0
expect.result = "Hello, World!"

[[runs]]
input = [ "greet", "Alice" ]

expect.exit-code = 0
expect.result = "Hello, Alice!"

[[runs]]
input = [ "greet", "Alice", "-r", "5" ]

expect.exit-code = 0
expect.result = "Hello, Alice, Alice, Alice, Alice, Alice!"
