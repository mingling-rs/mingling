[[runs]]
input = [ "greet" ]

expect.exit-code = 0
expect.result = "Hello, World!"

[[runs]]
input = [ "greet", "Alice" ]

expect.exit-code = 0
expect.result = "Hello, Alice!"

[[runs]]
input = [ "desc" ]

expect.exit-code = 0
expect.result = "EntryGreet desc = ok"

[[runs]]
input = [ "nodoc" ]

expect.exit-code = 0
expect.result = "EntryDescription has no description"
