<!doctype html>
<html lang="zh-Hans">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover"
        />

        <title>Mingling 中文文档</title>
        <meta
            name="Mingling Documents"
            content="Quick start with Mingling and build your command-line program!"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="icon" type="image/png" href="res/favicon_small.png" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../css/light.css" />
        <link
            id="dark-style"
            rel="stylesheet"
            href="../css/dark.css"
            disabled
        />
        <link rel="stylesheet" href="../css/doc-nav.css" />
    </head>

    <body>
        <nav>
            <a
                href="#"
                onclick="
                    toggleTheme();
                    return false;
                "
                >🌗 主题</a
            >
            <a href="../doc.html"><b>English Docs</b></a>
        </nav>
        <div id="app"></div>

        <script>
            window.$docsify = {
                name: "Mingling 中文文档",
                repo: "true",
                corner: {
                    url: "https://github.com/mingling-rs/mingling",
                    icon: "github",
                },
                auto2top: true,
                loadSidebar: true,
                maxLevel: 0,
                subMaxLevel: 3,
                search: {
                    placeholder: "Search",
                    noData: "No matches found.",
                    depth: 2,
                },
                plugins: [
                    function (hook) {
                        hook.beforeEach(function (content) {
                            return content
                                .split("\n")
                                .filter(function (line) {
                                    return !line.startsWith("@@@");
                                })
                                .join("\n");
                        });
                    },
                    [
                        "flexible-alerts",
                        {
                            style: "flat",
                            labels: {
                                NOTE: "笔记",
                                TIP: "小贴士",
                                IMPORTANT: "重点",
                                WARNING: "注意",
                                CAUTION: "警告",
                            },
                        },
                    ],
                ],
            };
        </script>

        <script src="../scripts/docsify.min.js"></script>

        <script src="../scripts/zoom-image.min.js"></script>
        <script src="../scripts/search.js"></script>
        <script src="../scripts/prism-bash.min.js"></script>
        <script src="../scripts/prism-toml.min.js"></script>
        <script src="../scripts/prism-rust.js"></script>
        <script src="../scripts/docsify-corner.js"></script>
        <script src="../scripts/docsify-plugin-flexible-alerts.js"></script>
        <script src="../scripts/docsify-plugin-prevnext.js"></script>
        <script src="../scripts/mermaid.min.js"></script>
        <script src="../scripts/docsify-mermaid.js"></script>

        <script src="../scripts/day-night-switch.js"></script>
    </body>
</html>
