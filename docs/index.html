<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover"
        />

        <title>Mingling Helpdoc</title>
        <meta
            name="Mingling Helpdoc"
            content="Quick start with Mingling and build your command-line program!"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="icon" type="image/png" href="res/favicon_small.png" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/light.css" />
        <link id="dark-style" rel="stylesheet" href="css/dark.css" disabled />
        <link rel="stylesheet" href="css/doc-nav.css" />
    </head>

    <body>
        <nav>
            <a
                href="#"
                onclick="
                    toggleTheme();
                    return false;
                "
                >🌗 Theme</a
            >
            <a href="_zh_CN/index.html"><b>🇨🇳 CN Docs</b></a>
        </nav>
        <div id="app"></div>

        <script>
            window.$docsify = {
                name: "Mingling Helpdoc",
                repo: "true",
                corner: {
                    url: "https://github.com/mingling-rs/mingling",
                    icon: "github",
                },
                auto2top: true,
                loadSidebar: true,
                maxLevel: 0,
                subMaxLevel: 0,
                search: {
                    placeholder: "Search",
                    noData: "No matches found.",
                    depth: 2,
                },
                notVerified: {
                    text: "This code block is not verified",
                },
                plugins: [
                    function (hook) {
                        hook.beforeEach(function (content) {
                            return content
                                .split("\n")
                                .filter(function (line) {
                                    return !line.startsWith("@@@");
                                })
                                .join("\n");
                        });
                    },
                    [
                        "flexible-alerts",
                        {
                            style: "flat",
                            labels: {
                                NOTE: "Note",
                                TIP: "Tip",
                                IMPORTANT: "Important",
                                WARNING: "Warning",
                                CAUTION: "Caution",
                            },
                        },
                    ],
                ],
            };
        </script>

        <!--<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>-->
        <script src="scripts/docsify.min.js"></script>

        <!--<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify-corner/dist/docsify-corner.js"></script>
        <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>-->
        <script src="scripts/zoom-image.min.js"></script>
        <script src="scripts/search.js"></script>
        <script src="scripts/prism-bash.min.js"></script>
        <script src="scripts/prism-toml.min.js"></script>
        <script src="scripts/prism-rust.js"></script>
