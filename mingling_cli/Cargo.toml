[package]
name = "mingling-cli"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mingling-rs/mingling/tree/main/mingling_cli"
authors = ["Weicao-CatilGrass"]
readme = "README.md"

description = "Mingling's scaffolding tool for generating, analyzing, and modifying Mingling projects"
keywords = ["cli", "cli-framework", "command-line", "tools"]
categories = ["command-line-interface"]

[[bin]]
name = "mling"
path = "src/main.rs"

[dependencies.mingling]
path = "../mingling"
features = [
    "picker",
    "pathf",
    "extra_macros",
    "structural_renderer"
]

[build-dependencies.mingling]
path = "../mingling"
features = [
    "builds",
    "pathf",
]

[dependencies]
cargo_metadata = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace]
